<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Matematyczny Czar Par</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="hero-card">
  <div>
    <p class="eyebrow">System Rankingowy</p>
    <h1>Matematyczny Czar Par 2026</h1>
    <p class="lead">Interfejs komisji</p>
  </div>

  <div class="button-row">
    <button onclick="openPodium()">🖥 Podium</button>
    <button onclick="exportBackup()">💾 Backup</button>
    <button onclick="importBackup()">📥 Import</button>
    <button class="danger" onclick="resetAll()">Reset</button>
  </div>
</header>

<main class="page-shell">
  <section class="panel">
    <div class="panel-heading">
      <div>
        <p class="eyebrow">Ustawienia</p>
        <h2>Nazwy kategorii</h2>
      </div>
      <button onclick="addPair()">➕ Dodaj parę</button>
    </div>

    <div class="category-grid">
      <label>
        <span>Klasy 4–5</span>
        <input id="category-name-1" type="text" data-role="category-name" data-key="cat1" placeholder="Klasy 4–5">
      </label>
      <label>
        <span>Klasy 6–7</span>
        <input id="category-name-2" type="text" data-role="category-name" data-key="cat2" placeholder="Klasy 6–7">
      </label>
    </div>
  </section>

  <section id="leaderboards" class="leaderboard-grid">
    <article class="panel board-card">
      <div class="panel-heading compact">
        <div>
          <p class="eyebrow">Ranking</p>
          <h2 id="summary-1">Klasy 4–5</h2>
        </div>
        <span class="pill">Wszystkie pary</span>
      </div>
      <div id="board-1" class="board-list"></div>
    </article>

    <article class="panel board-card">
      <div class="panel-heading compact">
        <div>
          <p class="eyebrow">Ranking</p>
          <h2 id="summary-2">Klasy 6–7</h2>
        </div>
        <span class="pill">Wszystkie pary</span>
      </div>
      <div id="board-2" class="board-list"></div>
    </article>
  </section>

  <section class="panel">
    <div class="panel-heading">
      <div>
        <p class="eyebrow">Edycja danych</p>
        <h2>Pary i punkty</h2>
      </div>
      <p class="muted">Podgląd 3 najlepszych par na żywo w zakładce podium</p>
    </div>

    <div id="pairs" class="pairs-grid"></div>
  </section>
</main>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>

</body>
</html>
