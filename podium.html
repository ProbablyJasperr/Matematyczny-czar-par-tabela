<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Podium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/podium.css">
</head>
<body>

<header class="hero-card">
  <div>
    <h1>Wyniki konkursu</h1>
  </div>
</header>

<main class="page-shell">
  <section class="podium-section">
    <article class="panel podium-card-panel">
      <div class="panel-heading compact">
        <div>
          <p class="eyebrow">Kategoria</p>
          <h2 id="category-title-1">Klasy 4–5</h2>
        </div>
        <span class="pill">Top 3</span>
      </div>
      <div id="podium-1" class="podium-grid three-columns"></div>
    </article>

    <article class="panel podium-card-panel">
      <div class="panel-heading compact">
        <div>
          <p class="eyebrow">Kategoria</p>
          <h2 id="category-title-2">Klasy 6–7</h2>
        </div>
        <span class="pill">Top 3</span>
      </div>
      <div id="podium-2" class="podium-grid three-columns"></div>
    </article>
  </section>
</main>

<script src="js/storage.js"></script>
<script src="js/podium.js"></script>

</body>
</html>
